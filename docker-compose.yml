# The local development stack: the API's own Postgres, and — under the
# `targets` profile, so a plain `docker compose up` leaves them alone — two
# sample databases to point a postgres_query and a clickhouse_query data
# source at without any external credentials (`make targets-up`). Both are
# seeded with an `events` table from docker/sample-*/.
services:
  postgres:
    image: postgres:18
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: always
    ports:
      - "15460:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pixelaudit_api_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-sample:
    image: postgres:18
    profiles: ["targets"]
    restart: always
    ports:
      - "15461:5432"
    environment:
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
      POSTGRES_DB: shop
    volumes:
      - ./docker/sample-postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    profiles: ["targets"]
    restart: always
    ports:
      - "18123:8123"
      - "19000:9000"
    environment:
      CLICKHOUSE_USER: sample
      CLICKHOUSE_PASSWORD: sample
      CLICKHOUSE_DB: shop
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./docker/sample-clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
