{{- if and (include "pixelaudit.internalDatabase" .) (not .Values.database.internal.passwordSecret.name) }}
{{- $name := include "pixelaudit.postgresName" . -}}
{{- $key := .Values.database.internal.passwordSecret.key -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
# The chart's own Postgres password, when none is given: generated on the
# first install, read back from the cluster on every later render so an
# upgrade never rotates it under the running database, and kept on
# uninstall together with the volume it unlocks.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pixelaudit.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  {{- if and $existing (hasKey $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc }}
  {{- end }}
{{- end }}
