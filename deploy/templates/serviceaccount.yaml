{{- if .Values.serviceAccount.create }}
# The pods' ServiceAccount, when the chart creates one. The boot Job is a
# pre-install/upgrade hook and runs as it, before the release's regular
# resources are created — so the ServiceAccount is a hook too, ordered ahead
# of the Job (a lower weight). Recreated on every install and upgrade
# (before-hook-creation; nothing mounts its token, so nothing notices), and,
# like every hook, left in place on uninstall.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pixelaudit.serviceAccountName" . }}
  labels:
    {{- include "pixelaudit.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
