{{- if and .Values.gateway.enabled (not .Values.gateway.existing.name) }}
{{- $fullname := include "pixelaudit.fullname" . -}}
{{- $className := required "gateway.className is required when the chart creates the Gateway (or name gateway.existing)" .Values.gateway.className -}}
{{- $hostname := include "pixelaudit.hostname" . -}}
# The Gateway the HTTPRoute attaches to: a listener for the hostname on
# port 80 and, with tls, on 443 serving the TLS Secret — cert-manager
# fills it in when gateway.annotations names an issuer, or create it
# yourself under gateway.tlsSecretName. Needs the Gateway API CRDs and a
# controller for gateway.className in the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "pixelaudit.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ $hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.tls }}
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ $hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.tlsSecretName | default (include "pixelaudit.defaultTlsSecretName" .) }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
