# The admin panel: a static build served by nginx. The API's address is not
# baked into the bundle — the container writes it into /config.js from
# API_URL on every start, so the one image serves any install.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pixelaudit.fullname" . }}-admin
  labels:
    {{- include "pixelaudit.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "pixelaudit.selectorLabels" (dict "root" . "component" "admin") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pixelaudit.selectorLabels" (dict "root" . "component" "admin") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pixelaudit.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "pixelaudit.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: admin
          image: {{ include "pixelaudit.image" (dict "root" . "component" "admin") | quote }}
          imagePullPolicy: {{ include "pixelaudit.imagePullPolicy" . }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.admin.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            timeoutSeconds: 3
          env:
            - name: PORT
              value: {{ .Values.admin.port | quote }}
            - name: API_URL
              value: {{ printf "%s://%s" (include "pixelaudit.scheme" .) (include "pixelaudit.apiHost" .) | quote }}
          {{- with .Values.admin.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # What nginx writes at run time, on a read-only root filesystem:
          # its cache, its pid, the rendered server block, and /config.js
          # in the web root (the entrypoint overwrites that one file).
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
