{{- if .Values.gateway.enabled }}
{{- $fullname := include "pixelaudit.fullname" . -}}
{{- $gatewayName := .Values.gateway.existing.name | default $fullname -}}
{{- $gatewayNamespace := .Values.gateway.existing.namespace | default .Release.Namespace -}}
{{- range $component, $host := dict "api" (include "pixelaudit.apiHost" .) "admin" (include "pixelaudit.adminHost" .) }}
---
# The {{ $component }} hostname, routed to its Service through the Gateway
# the chart created (gateway.className) or the one named by gateway.existing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-{{ $component }}
  labels:
    {{- include "pixelaudit.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  parentRefs:
    - name: {{ $gatewayName }}
      namespace: {{ $gatewayNamespace }}
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullname }}-{{ $component }}
          port: 80
{{- end }}
{{- end }}
