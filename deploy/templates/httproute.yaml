{{- if .Values.gateway.enabled }}
{{- $fullname := include "pixelaudit.fullname" . -}}
# The hostname, routed to the Service through the Gateway the chart created
# (gateway.className) or the one named by gateway.existing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "pixelaudit.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.existing.name | default $fullname }}
      namespace: {{ .Values.gateway.existing.namespace | default .Release.Namespace }}
  hostnames:
    - {{ include "pixelaudit.hostname" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullname }}
          port: 80
{{- end }}
