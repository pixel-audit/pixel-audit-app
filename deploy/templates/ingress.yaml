{{- if .Values.ingress.enabled }}
{{- $fullname := include "pixelaudit.fullname" . -}}
# The one hostname — the panel and, under /api, the API — on one Ingress.
# With tls the TLS Secret comes from cert-manager, when ingress.annotations
# names an issuer, or from you under ingress.tlsSecretName.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "pixelaudit.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.tls }}
  tls:
    - hosts:
        - {{ include "pixelaudit.hostname" . }}
      secretName: {{ .Values.ingress.tlsSecretName | default (include "pixelaudit.defaultTlsSecretName" .) }}
  {{- end }}
  rules:
    - host: {{ include "pixelaudit.hostname" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}
                port:
                  name: http
{{- end }}
