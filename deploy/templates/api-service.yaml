apiVersion: v1
kind: Service
metadata:
  name: {{ include "pixelaudit.fullname" . }}-api
  labels:
    {{- include "pixelaudit.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "pixelaudit.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
