{{- if include "pixelaudit.renderApiSecret" . }}
# What was given inline — database.url, secrets.secretKeyBase,
# secrets.secretKey — as a Secret the API pods and the boot Job read.
# A value left empty is simply absent: an existingSecret supplies it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pixelaudit.apiSecretName" . }}
  labels:
    {{- include "pixelaudit.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.database.url }}
  DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.secretKeyBase }}
  SECRET_KEY_BASE: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.secretKey }}
  SECRET_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
