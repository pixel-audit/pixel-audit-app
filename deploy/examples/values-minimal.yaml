# A production-shaped install: your managed Postgres, an Ingress with TLS
# from cert-manager, one Meta connection. Every secret is a Secret you
# create first:
#
#   kubectl create namespace pixelaudit
#   kubectl -n pixelaudit create secret generic pixelaudit-keys \
#     --from-literal=WEB_SECRET_KEY_BASE="$(openssl rand -base64 64 | tr -d '\n')" \
#     --from-literal=CREDENTIALS_ENCRYPTION_KEY="$(openssl rand -hex 32)"
#   kubectl -n pixelaudit create secret generic pixelaudit-database \
#     --from-literal=DATABASE_URL='postgres://pixelaudit:...@postgres.example.com:5432/pixelaudit?sslmode=require'
#   kubectl -n pixelaudit create secret generic pixelaudit-connections \
#     --from-literal=CONNECTION_fb_TYPE=meta-api \
#     --from-literal=CONNECTION_fb_PIXEL_ID=123456789012345 \
#     --from-literal=CONNECTION_fb_ACCESS_TOKEN=EAA...
#
#   helm install pixelaudit oci://ghcr.io/pixel-audit/charts/pixelaudit \
#     --namespace pixelaudit --atomic --values values-minimal.yaml

hostname: pixelaudit.example.com
tls: true

secrets:
  secretName: pixelaudit-keys

database:
  external:
    secretName: pixelaudit-database

app:
  extraEnvFrom:
    - secretRef:
        name: pixelaudit-connections

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
