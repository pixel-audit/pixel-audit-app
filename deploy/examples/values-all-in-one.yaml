# Everything in the cluster, nothing external: the chart's own PostgreSQL 18
# on a volume (its password generated and kept), a plain-http Ingress. For
# a try-out on kind or minikube, not for production. The only Secret to
# create first is the keys:
#
#   kubectl create namespace pixelaudit
#   kubectl -n pixelaudit create secret generic pixelaudit-keys \
#     --from-literal=PHOENIX_SECRET_KEY_BASE="$(openssl rand -base64 64 | tr -d '\n')" \
#     --from-literal=CREDENTIALS_ENCRYPTION_KEY="$(openssl rand -hex 32)"
#   helm install pixelaudit deploy --namespace pixelaudit --atomic \
#     --values deploy/examples/values-all-in-one.yaml

hosts:
  api: pixelaudit-api.127.0.0.1.nip.io
  admin: pixelaudit.127.0.0.1.nip.io
  tls: false

secrets:
  secretName: pixelaudit-keys

database:
  internal:
    enabled: true
    storage:
      size: 2Gi
      # storageClassName: standard

ingress:
  enabled: true
  className: nginx
