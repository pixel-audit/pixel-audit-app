# Everything in the cluster, nothing external: the Bitnami PostgreSQL
# subchart holds the database, the ingress is plain http, the keys are
# inline. For a try-out on kind or minikube, not for production (replace
# the placeholder secrets before using it anywhere that matters).
#
#   helm dependency build deploy      # once: fetches the postgresql subchart
#   helm install pixelaudit deploy --namespace pixelaudit --create-namespace \
#     --atomic --values deploy/examples/values-all-in-one.yaml

api:
  hostname: pixelaudit-api.127.0.0.1.nip.io

admin:
  hostname: pixelaudit.127.0.0.1.nip.io

secrets:
  # openssl rand -base64 64 | tr -d '\n'
  secretKeyBase: replace-me-with-sixty-four-or-more-characters-from-openssl-rand-base64-64
  # openssl rand -hex 32
  secretKey: 0f1e2d3c4b5a69788796a5b4c3d2e1f00112233445566778899aabbccddeeff0

ingress:
  className: nginx
  tls: false

postgresql:
  enabled: true
  auth:
    username: pixelaudit
    password: pixelaudit-dev
    database: pixelaudit
  primary:
    persistence:
      size: 2Gi
