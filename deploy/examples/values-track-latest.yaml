# Like values-minimal.yaml, but running the main branch: the `latest`
# images CI publishes on every push to main, re-fetched on every pod start.
# After CI has moved `latest`, pick it up with
#
#   helm upgrade pixelaudit oci://ghcr.io/pixel-audit/charts/pixelaudit \
#     --namespace pixelaudit --reuse-values --atomic
#   kubectl -n pixelaudit rollout restart deployment -l app.kubernetes.io/instance=pixelaudit
#
# (the upgrade re-runs the boot Job, so a migration that came with the new
# images is applied before the restart).

image:
  trackLatest: true

hosts:
  api: pixelaudit-api.example.com
  admin: pixelaudit.example.com
  tls: true

secrets:
  secretName: pixelaudit-keys

database:
  external:
    secretName: pixelaudit-database

api:
  extraEnvFrom:
    - secretRef:
        name: pixelaudit-connections

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
