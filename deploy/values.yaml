# PixelAudit — values for an on-premise install.
#
# One release installs the application — the API, which also serves the
# admin panel, one image under one hostname — with its boot Job
# (migrations and the CONNECTION_* environment applied before the pods roll
# out). The only state is the Postgres database: a managed one of yours
# (database.external) or the chart's own PostgreSQL 18 on a persistent
# volume (database.internal).
#
# Secrets are never written in values: the chart reads them from Secrets
# you create (secrets.secretName, database.external.secretName).
#
# Nothing is exposed to the network by default: switch on `ingress` or
# `gateway` (Gateway API) to publish the hostname.
#
# What has to be set: hostname, secrets.secretName, one of
# database.external.secretName / database.internal.enabled, and one way of
# exposing the hostname. deploy/examples/ has a values file for each shape.

image:
  # The images CI publishes to the GitHub Container Registry: public
  # packages, so no pull secret is needed. The repository is the GitHub
  # <organisation>/<repository> the code lives under (pixel-audit/pixel-audit-app);
  # a fork publishes under its own.
  registry: ghcr.io
  # The image is <registry>/<repository>: ghcr.io/pixel-audit/pixel-audit-app,
  # the API and the panel together.
  repository: pixel-audit/pixel-audit-app
  # Which version to run — two ways:
  #
  #   A particular release: leave `tag` empty (the chart's appVersion, the
  #   X.Y.Z of the vX.Y.Z release the chart came from) or name any released
  #   X.Y.Z; pulled once (IfNotPresent).
  #
  #   The main branch: `trackLatest: true` runs the `latest` tag, which CI
  #   moves on every push to main, with pullPolicy Always so every pod
  #   start fetches the current one. A newer `latest` is picked up by
  #   `helm upgrade` (the boot Job re-runs the migrations) followed by
  #   `kubectl rollout restart deployment/<release>`.
  #
  # trackLatest overrides tag and pullPolicy in one switch.
  tag: ""
  pullPolicy: IfNotPresent
  trackLatest: false
  # Names of image pull Secrets in the release namespace — only for a
  # private registry or a private fork (`kubectl create secret docker-registry ...`).
  pullSecrets: []

# The public hostname the panel and the API (under /api) are served at.
# Required whether or not anything exposes it: the application is told
# its own hostname (HOSTNAME).
hostname: ""
# Whether the hostname is served over https — by the Ingress or the Gateway
# below, or by whatever you put in front.
tls: true

# Where this program's source is offered (AGPL §13): the panel's foot links
# there. A fork points it at its own repository.
sourceUrl: https://github.com/pixel-audit/pixel-audit-app

# The Secret holding the API's two secrets. Required. Create it with
#   kubectl create secret generic pixelaudit-keys \
#     --from-literal=WEB_SECRET_KEY_BASE="$(openssl rand -base64 64 | tr -d '\n')" \
#     --from-literal=CREDENTIALS_ENCRYPTION_KEY="$(openssl rand -hex 32)"
#
#   WEB_SECRET_KEY_BASE     Phoenix's signing secret (64+ characters):
#                               what the framework signs its tokens and
#                               cookies with. Rotating it costs nothing here.
#   CREDENTIALS_ENCRYPTION_KEY  the 256-bit key (64 hex characters) the
#                               connection credentials are encrypted with at
#                               rest. Back it up with the database: a
#                               database restored without it cannot read
#                               any stored credential.
secrets:
  secretName: ""
  # The keys inside it.
  keys:
    webSecretKeyBase: WEB_SECRET_KEY_BASE
    credentialsEncryptionKey: CREDENTIALS_ENCRYPTION_KEY

database:
  # A managed Postgres of yours (15 or later): a Secret holding its URL —
  #   postgres://user:password@host:5432/db?sslmode=require
  # (sslmode=require or verify-full for TLS). Leave empty to run the
  # chart's own Postgres below instead.
  external:
    secretName: ""
    secretKey: DATABASE_URL

  # The chart's own PostgreSQL: a StatefulSet of one pod on a persistent
  # volume, for an install with no managed database. PostgreSQL 18 or
  # later — the tag is checked by the schema. Backed up by you.
  internal:
    enabled: false
    image:
      repository: docker.io/library/postgres
      tag: "18"
      pullPolicy: IfNotPresent
    storage:
      # The volume's size; the claim cannot shrink later.
      size: 10Gi
      # The StorageClass; empty: the cluster's default class.
      storageClassName: ""
    database: pixelaudit
    username: pixelaudit
    # The Secret holding the database user's password. Empty: the chart
    # generates one on the first install and keeps it across upgrades (the
    # generated Secret is kept on uninstall, with the volume).
    passwordSecret:
      name: ""
      key: POSTGRES_PASSWORD
    # CPU and memory for the Postgres pod; none by default.
    resources: {}
    # What the boot Job waits for the database with on a first install (a
    # busybox with `nc`): the chart's Postgres only exists once the
    # release's resources are created.
    waitImage: docker.io/library/busybox:1.37

# Expose the hostnames with an Ingress. Off by default.
ingress:
  enabled: false
  # The IngressClass; empty: the cluster's default.
  className: ""
  # e.g. cert-manager.io/cluster-issuer: letsencrypt
  annotations: {}
  # With hosts.tls, the TLS Secret covering both hostnames; empty:
  # <release full name>-tls, which cert-manager fills in when the annotation
  # above names an issuer.
  tlsSecretName: ""

# Expose the hostnames with the Gateway API (gateway.networking.k8s.io/v1)
# instead: an HTTPRoute per hostname, attached to a Gateway the chart
# creates (gateway.className) or to one that already exists
# (gateway.existing). Off by default; needs the Gateway API CRDs and a
# controller in the cluster.
gateway:
  enabled: false
  # The GatewayClass of the Gateway the chart creates — one listener per
  # hostname on port 80 and, with hosts.tls, on 443.
  className: ""
  # Annotations on the created Gateway, e.g. cert-manager.io/cluster-issuer.
  annotations: {}
  # With hosts.tls, the TLS Secret the https listeners serve; empty:
  # <release full name>-tls.
  tlsSecretName: ""
  # Attach the routes to an existing Gateway instead of creating one. Its
  # listeners must admit routes from this namespace and these hostnames.
  existing:
    name: ""
    namespace: ""

app:
  replicaCount: 1
  # The port the container listens on (PORT).
  port: 4000
  # Size of the connection pool to the database (DATABASE_POOL_SIZE).
  poolSize: 10
  # Extra environment for the pods and the boot Job — the place for
  # CONNECTION_* variables, from a Secret you create (app.extraEnvFrom) or
  # inline for the non-secret ones (app.extraEnv); see the README.
  extraEnv: []
  #  - name: CONNECTION_shop_TYPE
  #    value: postgres
  extraEnvFrom: []
  #  - secretRef:
  #      name: pixelaudit-connections
  # CPU and memory for the pods; none by default. Idle, the application
  # takes about 100Mi; a refresh of a wide range may take a few hundred more.
  resources: {}
  #  requests: { cpu: 50m, memory: 128Mi }
  #  limits: { cpu: "1", memory: 512Mi }
  # The boot Job (migrations + CONNECTION_* sync), a pre-install/upgrade hook.
  boot:
    # How long the Job may take before Helm gives up on the release.
    activeDeadlineSeconds: 600
    # CPU and memory for the Job's pod; none by default.
    resources: {}

# Where the pods may run.
nodeSelector: {}
tolerations: []
affinity: {}

# The ServiceAccount every pod runs as — the application, the boot Job and
# the chart's Postgres. None of them talks to the Kubernetes API (no token
# is mounted), so by default they run as the namespace's `default` one.
serviceAccount:
  # Whether to create a ServiceAccount for the pods (one for all of them),
  # e.g. to annotate it for a cloud workload identity. It is created as a
  # pre-install/upgrade hook ahead of the boot Job, which runs before the
  # release's regular resources exist; being a hook, it stays on uninstall.
  create: false
  # Its name. With create: empty is the release's full name. Without
  # create: an existing ServiceAccount in the release namespace, empty is
  # the namespace's `default`.
  name: ""
  # Annotations on the created ServiceAccount.
  annotations: {}

# Every container runs unprivileged: the application as the release's
# `nobody`, Postgres as its own user. These apply to the application's
# pods; the Postgres pod has its own.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  # The application writes nothing to its filesystem.
  readOnlyRootFilesystem: true
